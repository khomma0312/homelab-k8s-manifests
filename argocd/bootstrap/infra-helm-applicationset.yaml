apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-helm-applicationset
  namespace: argocd
spec:
  goTemplate: true
  generators:
  - git:
      repoURL: 'https://github.com/khomma0312/homelab-k8s-manifests.git'
      revision: HEAD
      files:
      - path: 'argocd/config/infra-helm/*.yaml'
  template:
    metadata:
      name: 'infra-{{ .infra.name }}'
    spec:
      project: default
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{ .infra.namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
        automated:
          prune: true
          selfHeal: true
  templatePatch: |
    spec:
      sources:
        - repoURL: '{{ .infra.chartRepoURL }}'
          chart: '{{ .infra.chartName }}'
          targetRevision: '{{ .infra.chartVersion }}'
          helm:
            valueFiles:
              - $values/infra/{{ .infra.name }}/values.yaml
        - repoURL: 'https://github.com/khomma0312/homelab-k8s-manifests.git'
          targetRevision: HEAD
          ref: values
        {{- if .infra.secrets }}
        - repoURL: 'https://github.com/khomma0312/homelab-k8s-manifests.git'
          targetRevision: HEAD
          path: 'infra/{{ .infra.name }}/secrets'
        {{- end }}