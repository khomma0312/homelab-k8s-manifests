apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: individual-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/khomma0312/homelab-k8s-manifests.git
    targetRevision: HEAD
    path: argocd/individual
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true