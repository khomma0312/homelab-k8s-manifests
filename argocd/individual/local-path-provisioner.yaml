apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: individual-local-path-provisioner
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/rancher/local-path-provisioner.git
      path: deploy/chart/local-path-provisioner
      targetRevision: v0.0.37
      helm:
        valueFiles:
          - $values/infra/local-path-provisioner/values.yaml
    - repoURL: https://github.com/khomma0312/homelab-k8s-manifests.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: local-path-storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true