apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: individual-sealed-secret-resources
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/khomma0312/homelab-k8s-manifests.git
      path: infra/sealed-secret-resources
      targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secret-resources
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true