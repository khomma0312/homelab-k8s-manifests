# ---- Prometheus ----
prometheus:
  prometheusSpec:
    # 載せ先: ミニPC(Toleration)の場合
    nodeSelector:
      kubernetes.io/arch: amd64
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    scrapeInterval: 60s
    evaluationInterval: 60s
    retention: 7d
    retentionSize: 15GB

    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 1Gi }

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 20Gi

    # 他のNamespaceのPodMonitor/ServiceMonitorも拾う(cert-managerなど)
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# ---- Alertmanager ----
alertmanager:
  enabled: false   # 通知を使わないなら無効化

# ---- Grafana ----
grafana:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  persistence:
    enabled: false   # ダッシュボードをコード管理するなら不要
  sidecar:
    dashboards:
      enabled: true

# ---- kubeadm環境で取得できない対象を無効化 ----
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# ---- 周辺コンポーネント ----
kube-state-metrics:
  resources:
    limits: { memory: 128Mi }
prometheus-node-exporter:
  resources:
    limits: { memory: 64Mi }
prometheusOperator:
  resources:
    limits: { memory: 128Mi }